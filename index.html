<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電卓作業応援タイマー</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- 1ページ目 -->
    <section id="page1" class="page">

        <h1>キャラクターを選んでね！</h1>

        <div class="character-list">

            <button class="character-btn" data-character="runa">
                紲星 るな
            </button>

            <button class="character-btn" data-character="dog">
                準備中
            </button>

        </div>



        <div class="update-box">
            <h2>アップデート内容</h2>

            <div class="update-list">

                <p>2026/07/16</p>
                <ul>
                    <li>「紲星るな」のセリフを変更しました。</li>
                    <li>アップデート内容を追加</li>
                </ul>

                <p>2026/07/15</p>
                <ul>
                    <li>サイトを公開しました。</li>
                </ul>
            </div>
        </div>


    </section>

    <!-- 2ページ目 -->
    <section id="page2" class="page hidden">

        <h1>作業タイマー</h1>

        <div id="timer">00:00:00</div>

        <img id="workImage" src="" alt="キャラクター">

        <div class="buttons">
            <button id="startBtn">作業開始</button>
            <button id="finishBtn" style="display: none;">作業完了</button>
        </div>

    </section>

    <!-- 3ページ目 -->
    <section id="page3" class="page hidden">

        <h1>作業完了！</h1>

        <p id="resultTime"></p>

        <img id="resultImage" src="" alt="キャラクター">

        <p id="comment"></p>

        <button id="shareBtn">
            Xで共有
        </button>

        <button id="restartBtn">
            もう一度作業
        </button>

    </section>

    <script src="script.js"></script>


</body>

</html>

</body>

</html>
